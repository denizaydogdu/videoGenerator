<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X (Twitter) Authorization — Velzon</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto;
         padding: 48px 24px; line-height: 1.6; }
  code { background: rgba(127,127,127,.15); padding: 8px 12px; border-radius: 8px;
         display: block; word-break: break-all; font-size: 14px; margin: 16px 0; }
</style>
</head>
<body>
<h1>✅ X yetkilendirme kodu</h1>
<p>Aşağıdaki kodu kopyalayıp Claude'a yapıştır:</p>
<code id="code">(kod bekleniyor…)</code>
<script>
  const p = new URLSearchParams(location.search);
  document.getElementById("code").textContent =
    p.get("code") || p.get("error_description") || p.get("error") || "kod bulunamadı";
</script>
</body>
</html>
