# API Keys (Set these via environment variables or replace with actual values)
suno.api.key=${SUNO_API_KEY}
openai.api.key=${OPENAI_API_KEY}
youtube.client.id=${YOUTUBE_CLIENT_ID}
youtube.client.secret=${YOUTUBE_CLIENT_SECRET}

# Application Settings
app.scheduler.enabled=true
app.scheduler.cron=0 12 * * *
app.scheduler.timezone=UTC

# Video Settings
video.width=1080
video.height=1920
video.fps=30
video.max.duration=180

# FFmpeg Paths (override if needed)
ffmpeg.path=ffmpeg
ffprobe.path=ffprobe

# Directory Settings
dir.output=output
dir.temp=temp
dir.logs=logs
dir.config=config

# Content Generation
music.default.genre=electronic
music.default.duration=20
video.default.mood=energetic

# API Limits
api.suno.daily.limit=50
api.youtube.daily.limit=6
api.openai.rpm.limit=60

# Retry Configuration
retry.max.attempts=3
retry.initial.delay.ms=1000
retry.max.delay.ms=8000

# Timeouts
http.connect.timeout.seconds=30
http.read.timeout.seconds=60
suno.polling.interval.ms=5000
suno.max.wait.time.ms=300000

# YouTube Settings
youtube.category.id=10
youtube.privacy.status=public
